name: Seasons
options:
  bundleIdPrefix: com.kiransmelser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "9.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Seasons:
    type: application
    platform: iOS
    attributes:
      DevelopmentTeam: "3FWT3PM62W"
      ProvisioningStyle: Automatic
    sources:
      - path: Seasons
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Seasons/Seasons.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        INFOPLIST_FILE: Seasons/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kiransmelser.seasons
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "3FWT3PM62W"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Seasons/Info.plist
      properties:
        CFBundleName: Seasons
        CFBundleDisplayName: Seasons
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Seasons uses your location to determine which growing region you're in, so we can show you locally seasonal produce."
        GIDClientID: 134875106487-dnojdorppqr1qn96gbag8c9gmj1u6507.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.134875106487-dnojdorppqr1qn96gbag8c9gmj1u6507

  SeasonsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeasonsTests
    dependencies:
      - target: Seasons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiransmelser.seasons.tests
