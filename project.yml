name: Seasons
options:
  bundleIdPrefix: com.kiransmelser
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Seasons:
    type: application
    platform: iOS
    sources:
      - path: Seasons
    settings:
      base:
        INFOPLIST_FILE: Seasons/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kiransmelser.seasons
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    info:
      path: Seasons/Info.plist
      properties:
        CFBundleName: Seasons
        CFBundleDisplayName: Seasons
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "Seasons uses your location to determine which growing region you're in, so we can show you locally seasonal produce."

  SeasonsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeasonsTests
    dependencies:
      - target: Seasons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiransmelser.seasons.tests
